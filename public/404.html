<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jose Computers &amp; Jose Tours &amp; Travels</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and converts the path and query
      // string into a query string parameter, then redirects the browser
      // to index.html so that React Router can restore the clean route.
      (function () {
        var l = window.location;
        // On GitHub Pages project sites (https://<user>.github.io/<repo>/),
        // pathSegmentsToKeep is 1 because the repository name is the first segment.
        // For custom domains or root deployments, pathSegmentsToKeep is 0.
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var repoName = 'computer-website';
        var hasRepo = pathSegments.length > 0 && pathSegments[0] === repoName;
        var pathSegmentsToKeep = hasRepo ? 1 : 0;

        var basePath = l.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/');

        var routePath = l.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/');

        var newUrl =
          l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          (basePath.endsWith('/') ? basePath.slice(0, -1) : basePath) +
          '/?/' +
          routePath.replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;

        l.replace(newUrl);
      })();
    </script>
  </head>
  <body>
    <!-- Fallback message for browsers without JavaScript -->
    <noscript>
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 4rem 1.5rem;">
        <h2 style="color: #0c4a60;">Jose Computers &amp; Jose Tours &amp; Travels</h2>
        <p style="color: #475569;">Redirecting to our website... <a href="/computer-website/" style="color: #20a7db;">Click here to enter</a>.</p>
      </div>
    </noscript>
  </body>
</html>
