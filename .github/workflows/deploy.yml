
name: Deploy React Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: |
          npm run build
          echo "Checking generated production HTML..."
          cat dist/index.html
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "ERROR: Production HTML still references src/main.jsx"
            exit 1
          fi
          if [ ! -f dist/404.html ]; then
            echo "ERROR: dist/404.html is missing for GitHub Pages SPA routing"
            exit 1
          fi
          echo "Verified dist/404.html exists for GitHub Pages client-side routing."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to gh-pages branch (Branch fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
